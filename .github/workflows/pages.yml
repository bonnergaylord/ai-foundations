# Publishes level-3/site to GitHub Pages on every push to main that touches it.
# There is no build step: the page is plain HTML, CSS and JavaScript.
name: Deploy parcel lookup page

on:
  push:
    branches: [main]
    paths: ["level-3/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: level-3/site
      - id: deployment
        uses: actions/deploy-pages@v4
